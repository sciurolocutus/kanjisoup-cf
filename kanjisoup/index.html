<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>Kanji Soup</title>
<style>
	div {
		font-size: 14em;
		text-align: center;
		margin: auto;
	} 
	.vertical-align {
		position: absolute;
		top: 50%;
		-webkit-transform: translateY(-50%);
		-ms-transform: translateY(-50%);
		transform: translateY(-50%);
	}

	.horiz-align {
		position: absolute;
		left: 30%;
	}

	.total-center {
		display: flex;
		display: -webkit-flex;
		height: 50%;
		width: 50%;
	}
</style>
</head>
<body>
	<div class="vertical-align horiz-align">漢字汁</div>
</body>
</html>
